<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 140" role="img" aria-labelledby="kelderaLogoTitle">
  <title id="kelderaLogoTitle">Keldera Technologies</title>
  <defs>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#B08A3E"/>
      <stop offset="100%" stop-color="#8C6C2E"/>
    </linearGradient>
  </defs>

  <!-- Seal mark -->
  <g transform="translate(70,70)">
    <circle cx="0" cy="0" r="58" fill="#0B1F33"/>
    <circle cx="0" cy="0" r="58" fill="none" stroke="url(#ringGrad)" stroke-width="4"/>
    <circle cx="0" cy="0" r="48" fill="none" stroke="#B08A3E" stroke-width="1" opacity="0.55"/>
    <!-- tick marks, evokes a calibrated instrument / assurance ring -->
    <g stroke="#B08A3E" stroke-width="2" opacity="0.85">
      <line x1="0" y1="-58" x2="0" y2="-50"/>
      <line x1="0" y1="58" x2="0" y2="50"/>
      <line x1="-58" y1="0" x2="-50" y2="0"/>
      <line x1="58" y1="0" x2="50" y2="0"/>
      <line x1="41" y1="-41" x2="35.5" y2="-35.5"/>
      <line x1="-41" y1="-41" x2="-35.5" y2="-35.5"/>
      <line x1="41" y1="41" x2="35.5" y2="35.5"/>
      <line x1="-41" y1="41" x2="-35.5" y2="35.5"/>
    </g>
    <!-- Abstract angular K, built from three strokes -->
    <g fill="none" stroke="#F5F3EE" stroke-width="9" stroke-linecap="square" stroke-linejoin="miter">
      <line x1="-18" y1="-30" x2="-18" y2="30"/>
      <line x1="-18" y1="2" x2="22" y2="-30"/>
      <line x1="-18" y1="2" x2="22" y2="30"/>
    </g>
    <line x1="-18" y1="2" x2="2" y2="2" stroke="#B08A3E" stroke-width="9"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(150,0)">
    <text x="0" y="65" font-family="'Fraunces','Source Serif Pro',Georgia,serif" font-size="42" font-weight="600" fill="#0B1F33">Keldera</text>
    <text x="0" y="96" font-family="'Inter',Arial,sans-serif" font-size="16" letter-spacing="4" fill="#4A5A68">TECHNOLOGIES</text>
  </g>
</svg>
